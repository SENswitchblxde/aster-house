name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install
        run: npm ci

      # Unpacks any uploaded .zip and checks every post. Fails with a plain
      # English message if a post is missing something.
      - name: Prepare journal
        run: node scripts/prepare-journal.mjs

      - name: Build
        env:
          # Project repo (username.github.io/aster-house)? Uncomment:
          # BASE_PATH: /aster-house
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
        run: npm run build

      # If a zip was unpacked, tidy the repo so it holds the loose files.
      # Uses GITHUB_TOKEN, so this commit does not retrigger the workflow —
      # the site has already been built above.
      - name: Commit unpacked files
        run: |
          if [ -n "$(git status --porcelain content/journal)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/journal
            git commit -m "Unpack journal upload [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
